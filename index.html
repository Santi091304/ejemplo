<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Pequeña Página</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            color: #333;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 10px 0;
        }
        section {
            padding: 20px;
            margin: 10px;
        }
        img {
            max-width: 100%;
            height: auto;
        }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px 0;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>Bienvenidos a Mi Página</h1>
    </header>

    <section>
        <h2>Acerca de esta página</h2>
        <p>Esta es una pequeña página de ejemplo en HTML. Puedes ver un encabezado, un párrafo, una imagen y un enlace.</p>
        <img src="https://via.placeholder.com/600x300" alt="Imagen de ejemplo">
    </section>

    <section>
        <h2>Enlace útil</h2>
        <p>Puedes visitar el siguiente enlace para más información:</p>
        <a href="https://www.wikipedia.org/" target="_blank">Ir a Wikipedia</a>
    </section>

    <footer>
        <p>&copy; 2025 Mi Página Web</p>
    </footer>

</body>
</html>
